[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pggb"
version = "0.1.0"
description = "Probe-Guided Gradient Balancing for Multimodal Learning"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Vo Quoc Vu", email = "s3575819@rmit.edu.vn"},
    {name = "Haytham Fayek", email = "haytham.fayek@rmit.edu.au"},
    {name = "Thuy Nguyen", email = "thuy.nguyen43@rmit.edu.vn"},
]
keywords = ["multimodal learning", "gradient modulation", "modality imbalance", "probe", "deep learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "librosa>=0.9.0",
    "opencv-python>=4.5.0",
    "pillow>=8.0.0",
    "tqdm>=4.62.0",
    "tensorboard>=2.10.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
    "transformers>=4.30.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "nibabel>=5.0.0",
    "monai>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
]

[project.scripts]
pggb-train = "scripts.train:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*", "configs*"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100
